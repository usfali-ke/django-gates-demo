<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Notes{% endblock %} · django-gates-demo-base page</title>
{% load static %}<link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
<header>
  <h1>django-gates-demo</h1>
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}
    <span>{{ user.username }}</span> <button type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
