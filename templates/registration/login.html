{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h2>Log in</h2>
{% if form.errors %}<p class="error">Your username or password did not match. Try again later.</p>{% endif %}
<form method="post" action="{% url 'login' %}">{% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
{% endblock %}
