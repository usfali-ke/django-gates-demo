# dev: the first environment a build reaches. devsecops-release.yml
# (environment: dev) commits the digest main's pipeline built, after G5.
# Argo CD app `django-gates-demo-dev` syncs it with selfHeal.
# The only automated edit is the image digest below (set_digest.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-gates-demo-dev

resources:
  - ../base

patches:
  - target: {kind: Rollout, name: django-gates-demo}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: DJANGO_ALLOWED_HOSTS
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: localhost,django-gates-demo,django-gates-demo-canary,django-gates-demo-stable,django-gates-demo.django-gates-demo-dev.svc,django-gates-demo-canary.django-gates-demo-dev.svc,django-gates-demo-stable.django-gates-demo-dev.svc
  - target: {kind: AnalysisTemplate, name: django-gates-demo-canary-health}
    patch: |
      - op: replace
        path: /spec/metrics/0/provider/web/url
        value: http://django-gates-demo-canary.django-gates-demo-dev.svc/healthz

images:
  # Never a tag: admission (Kyverno) requires digests. Every environment
  # starts at the digest prod already ran; promotion replaces it.
  - name: django-gates-demo
    newName: ghcr.io/usfali-ke/django-gates-demo
    digest: sha256:c6f34aeea826321111b529f8e94c10ee52c6868e79c9c79d51c9ff563053f298
