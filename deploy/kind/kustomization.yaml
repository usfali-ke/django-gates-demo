# GitOps source of truth for the kind environment. Argo CD (app
# `django-gates-demo-kind`) syncs this directory with selfHeal; nothing
# else writes to the namespace. The only automated edit is the image digest
# below, committed by devsecops-release.yml after G4 approves a change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-gates-demo

resources:
  - services.yaml
  - analysistemplate.yaml
  - rollout.yaml

images:
  # The all-zero digest is a placeholder until the first release replaces
  # it with a signed digest. Never put a tag here: admission (Kyverno)
  # requires digests.
  - name: django-gates-demo
    newName: ghcr.io/usfali-ke/django-gates-demo
    digest: sha256:f843645951af13cca92c2ab2854ffa44460873da4b8b154a6be01992b47d09ce
