# prod: gets only a digest that passed G3 in staging, and only after the
# release-approval review (job approve-prod). devsecops-release.yml
# after G5. Argo CD app `django-gates-demo-prod` syncs it with selfHeal;
# nothing else writes to the namespace.
# The only automated edit is the image digest below (set_digest.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-gates-demo-prod

resources:
  - ../base

patches:
  - target: {kind: Rollout, name: django-gates-demo}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: DJANGO_ALLOWED_HOSTS
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: localhost,django-gates-demo,django-gates-demo-canary,django-gates-demo-stable,django-gates-demo.django-gates-demo-prod.svc,django-gates-demo-canary.django-gates-demo-prod.svc,django-gates-demo-stable.django-gates-demo-prod.svc
  - target: {kind: AnalysisTemplate, name: django-gates-demo-canary-health}
    patch: |
      - op: replace
        path: /spec/metrics/0/provider/web/url
        value: http://django-gates-demo-canary.django-gates-demo-prod.svc/healthz

images:
  # Never a tag: admission (Kyverno) requires digests. Every environment
  # starts at the digest prod already ran; promotion replaces it.
  - name: django-gates-demo
    newName: ghcr.io/usfali-ke/django-gates-demo
    digest: sha256:31b21153f5a3579d7596fb1f541b8def06ae4293dbfb6074ce1cb2973354cbd1
