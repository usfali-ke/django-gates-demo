[project]
name = "django-gates-demo"
version = "0.1.0"
description = "Minimal Django notes app for testing the single-run DevSecOps pipeline end to end"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "gunicorn>=26",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.14",
    "requests>=2.32",
]

[tool.uv]
package = false
# Dependency cooldown: never resolve a release younger than a week (time for
# a malicious or broken upload to be caught and yanked).
exclude-newer = "7 days"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["config", "notes"]
omit = ["*/migrations/*", "config/wsgi.py"]
