[project]
name = "django-gates-demo"
version = "0.1.0"
description = "Minimal Django notes app for testing the single-run DevSecOps pipeline end to end"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "gunicorn>=26",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.14",
    "requests>=2.32",
    "ruff>=0.14",
]

[tool.uv]
package = false
# Dependency cooldown: never resolve a release younger than a week (time for
# a malicious or broken upload to be caught and yanked).
exclude-newer = "7 days"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests/unit"]
markers = ["smoke: read-only, no test users, no writes: safe to run against prod"]

[tool.coverage.run]
source = ["config", "notes"]
omit = ["*/migrations/*", "config/wsgi.py"]

# Code-quality threshold (control `code-quality`, G2): zero findings from
# these rule sets on the application code, and no function more complex
# than max-complexity (mccabe).
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
