# ZAP Automation Framework plan: authenticated spider + passive + active
# scan of pre-production. The pipeline logs in as a test user first and
# hands ZAP the session: the Cookie header on every request via ZAP's
# ZAP_AUTH_HEADER / ZAP_AUTH_HEADER_VALUE / ZAP_AUTH_HEADER_SITE, and the
# CSRF token as ZAP_CSRF for the API requests below. ZAP 2.17 substitutes
# env vars only in some fields (urls yes; request headers and replacer
# rules no), so the pipeline renders ${TARGET} / ${ZAP_CSRF} with envsubst
# into a runner-temp copy first. The scan covers the logged-in pages
# and the JSON API, not just the login form. Logout is out of scope so the
# session survives the scan.
#
#   envsubst '$TARGET $ZAP_CSRF' < tests/dast/zap-plan.yaml > /tmp/plan.yaml
#   docker run --network host -v /tmp/plan.yaml:/zap/plan.yaml:ro -v $PWD/reports:/zap/wrk/reports \
#     -e ZAP_AUTH_HEADER=Cookie -e ZAP_AUTH_HEADER_VALUE="sessionid=...; csrftoken=..." -e ZAP_AUTH_HEADER_SITE=localhost \
#     ghcr.io/zaproxy/zaproxy:stable zap.sh -cmd -autorun /zap/plan.yaml
env:
  contexts:
    - name: preprod
      urls:
        - ${TARGET}/notes/
        - ${TARGET}/api/notes/
        - ${TARGET}/accounts/login/
      includePaths:
        - ${TARGET}.*
      excludePaths:
        - ${TARGET}/accounts/logout/.*
  parameters:
    failOnError: true
    failOnWarning: true  # e.g. the seed requests not returning 201/200: the session did not work
    progressToStdout: true

jobs:
  - type: requestor
    # The spider only finds links and forms; seed the JSON API explicitly.
    # First, so an unauthenticated session fails the plan (failOnWarning)
    # before anything is scanned.
    requests:
      - url: ${TARGET}/api/notes/
        method: POST
        headers:
          - "Content-Type: application/json"
          - "Origin: ${TARGET}"
          - "X-CSRFToken: ${ZAP_CSRF}"
        data: '{"text": "zap seed"}'
        responseCode: 201
      - url: ${TARGET}/api/notes/
        method: GET
        responseCode: 200

  - type: spider
    parameters:
      context: preprod
      maxDuration: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: preprod
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 15

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: zap
    risks: [info, low, medium, high]
    confidences: [falsepositive, low, medium, high, confirmed]

  # DefectDojo's "ZAP Scan" parser reads only the XML report.
  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk/reports
      reportFile: zap
    risks: [info, low, medium, high]
    confidences: [falsepositive, low, medium, high, confirmed]

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: zap
