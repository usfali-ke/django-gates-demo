# The release pipeline: every dynamic test runs against an environment
# AFTER the new digest is deployed to it, never against a build.
#
#   devsecops-pipeline (CI)                   1 Build & unit tests, SAST,
#     └ Control Gate (G2) ──── starts ──▶       code quality, package
#   dev      2 Deploy to Dev                  integration tests · DAST ·
#     │                                       dependency re-check (G3)
#     ▼ Approval Gate `staging-approval`      test results, security scans,
#                                             release notes
#   staging  3 Deploy to Staging              end-to-end · performance ·
#     │                                       DAST (G3) · UAT
#     ▼ Approval Gate `release-approval` + G4 UAT sign-off, test results,
#                                             Go/No-Go, change window
#   prod     4 Deploy to Production           smoke · health watch (G6) ·
#                                             rollback plan; a failure after
#                                             the deploy starts the rollback
#   feedback Monitoring, logging & feedback   summary, change request + PR
#                                             comments, rollback command
#
# Each stage is devsecops-stage.yml for one environment (resolve → verify →
# approve → G5 → deploy → G6 → tests → evidence), and each passes the next
# the digest it deployed: staging and prod refuse to run if the previous
# environment has moved on to a newer release since.
#
# The pipeline starts a run at dev for every main commit it published.
# Start one by hand at any stage (Actions → devsecops-release → Run
# workflow): `start: staging` promotes what dev runs, `start: prod` what
# staging runs; `kind: rollback` redeploys the start environment's previous
# digest and stops there. prod needs the change request (input `change`,
# or the one whose Release field names the commit), and whoever started,
# re-ran or authored the change can't approve a stage.
#
# Waiting at an Approval Gate holds nothing up: a newer run's deploy to the
# same environment waits for this one's (concurrency per environment in
# devsecops-stage.yml), and if a newer run is already waiting there too,
# GitHub cancels the older waiting run's deploy.

name: devsecops-release
run-name: >-
  release ${{ inputs.commit && format('{0} ', inputs.commit) || '' }}from ${{ inputs.start }} (${{ inputs.kind }})

on:
  workflow_dispatch:
    inputs:
      start:
        description: Stage to start from (dev = a main commit's image; staging/prod = what the previous environment runs)
        required: true
        type: choice
        options: [dev, staging, prod]
        default: dev
      kind:
        description: Deployment kind (rollback = the start environment's digest before its last deploy, that stage only)
        required: true
        type: choice
        options: [planned, hotfix, fix_forward, rollback]
        default: planned
      commit:
        description: start dev only — the main commit whose image to deploy (default the commit this runs on)
        required: false
        type: string
      change:
        description: prod — change request being released (7, #7 or CHG-7); default the one whose Release field names this release
        required: false
        type: string

permissions: {}

jobs:
  dev:
    name: 2 Deploy to Dev
    if: github.ref == 'refs/heads/main' && inputs.start == 'dev'
    uses: ./.github/workflows/devsecops-stage.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: read
      statuses: read
      actions: read
      issues: write
      pull-requests: read
    with:
      environment: dev
      kind: ${{ inputs.kind }}
      commit: ${{ inputs.commit }}

  staging:
    name: 3 Deploy to Staging
    needs: dev
    # Chained: only after dev deployed AND passed its tests (the stage
    # fails otherwise). A rollback stays in the environment it started in.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (inputs.start == 'staging' || (inputs.start == 'dev' && inputs.kind != 'rollback' && needs.dev.result == 'success'))
    uses: ./.github/workflows/devsecops-stage.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: read
      statuses: read
      actions: read
      issues: write
      pull-requests: read
    with:
      environment: staging
      kind: ${{ inputs.kind }}
      expect-digest: ${{ needs.dev.outputs.digest }}

  prod:
    name: 4 Deploy to Production
    needs: staging
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (inputs.start == 'prod' || (inputs.start != 'prod' && inputs.kind != 'rollback' && needs.staging.result == 'success'))
    uses: ./.github/workflows/devsecops-stage.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: read
      statuses: read
      actions: read
      issues: write
      pull-requests: read
    with:
      environment: prod
      kind: ${{ inputs.kind }}
      change: ${{ inputs.change }}
      expect-digest: ${{ needs.staging.outputs.digest }}

  rollback:
    name: Rollback prod (automatic)
    # prod deployed and then failed its smoke tests or health watch (or
    # Argo CD's G6): start the rollback right away. It redeploys the
    # digest prod ran before (the deploy commit's Rollback-Digest) through
    # the same gates, so it still waits for a release-approval reviewer:
    # nothing reaches prod unapproved, but nobody has to work out what to
    # roll back to. A failed canary never gets here: Argo Rollouts has
    # already aborted it and prod still runs the old digest.
    needs: prod
    if: >-
      always() && github.ref == 'refs/heads/main' && inputs.kind != 'rollback' &&
      needs.prod.result == 'failure' && needs.prod.outputs.gitops-sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ needs.prod.outputs.change-id }}
          GITOPS_SHA: ${{ needs.prod.outputs.gitops-sha }}
        run: |
          set -euo pipefail
          gh workflow run devsecops-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f start=prod -f kind=rollback -f change="$CHANGE_ID"
          echo "prod failed after deploy ${GITOPS_SHA:0:7}: rollback started (devsecops-release, start prod, kind rollback${CHANGE_ID:+, ${CHANGE_ID}}); it waits for release-approval" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  feedback:
    name: Monitoring, logging & feedback
    # Every run ends here, whatever happened: where the release got to,
    # told to the people behind it (change request, pull requests) and, if
    # a stage failed after it deployed, the rollback that undoes it. The
    # dashboard gets the same from the artifacts (gate results, deployment
    # events, release evidence) and Argo CD's notifications.
    needs: [dev, staging, prod, rollback]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Summary + comments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          KIND: ${{ inputs.kind }}
          CHANGE: ${{ inputs.change }}
          ROLLBACK: ${{ needs.rollback.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; *) echo "⏭";; esac; }
          jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[]' | jq -s .)
          source=$(jq -r '[.[].outputs["source-sha"] // empty | select(. != "")][0] // empty' <<<"$NEEDS")
          digest=$(jq -r '[.[].outputs.digest // empty | select(. != "")][-1] // empty' <<<"$NEEDS")
          rollback=""
          table="| stage | result | digest | deploy commit | failed step |"$'\n'"|---|---|---|---|---|"
          for env in dev staging prod; do
            r=$(jq -r --arg e "$env" '.[$e].result' <<<"$NEEDS")
            d=$(jq -r --arg e "$env" '.[$e].outputs.digest // ""' <<<"$NEEDS")
            g=$(jq -r --arg e "$env" '.[$e].outputs["gitops-sha"] // ""' <<<"$NEEDS")
            name=$(case "$env" in dev) echo "2 Deploy to Dev";; staging) echo "3 Deploy to Staging";; prod) echo "4 Deploy to Production";; esac)
            failed=$(jq -r --arg n "$name" '[.[] | select((.name | startswith($n + " / ")) and .conclusion == "failure") | .name | sub("^[^/]+/ "; "")] | join(", ")' <<<"$jobs")
            table+=$'\n'"| ${name} | $(icon "$r") ${r} | ${d:+\`${d:0:19}…\`} | ${g:0:7} | ${failed} |"
            # Deployed, then failed its checks: say how to go back.
            if [ "$r" = failure ] && [ -n "$g" ] && [ "$env" = prod ] && [ "$ROLLBACK" = success ]; then
              rollback+=$'\n'"- **prod** failed after deploy: the rollback run was started automatically and waits for \`release-approval\`"
            elif [ "$r" = failure ] && [ -n "$g" ]; then
              rollback+=$'\n'"- **${env}** runs a digest that failed after deploy: \`gh workflow run devsecops-release.yml --ref main -f start=${env} -f kind=rollback\`"
            fi
          done
          body="### Release ${source:+${source:0:7} }(${KIND})${digest:+ · \`${digest:0:19}…\`} — [run](${RUN_URL})"$'\n\n'"${table}"
          [ -z "$rollback" ] || body+=$'\n\n'"#### Rollback"$'\n'"Argo Rollouts already aborts a canary that fails its analysis. For a problem found after the rollout:${rollback}"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$source" ] || exit 0
          # The change request (if any names this release) and the pull
          # requests merged as this commit hear how far it got.
          SOURCE_SHA=$source CHANGE=$CHANGE GITHUB_OUTPUT="$RUNNER_TEMP/change.out" bash .github/scripts/change.sh || true
          n=$(sed -n 's/^number=//p' "$RUNNER_TEMP/change.out" 2>/dev/null)
          [ -z "$n" ] || gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="$body" > /dev/null
          for pr in $(gh api "repos/${GITHUB_REPOSITORY}/commits/${source}/pulls" --jq '.[].number' 2>/dev/null); do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" > /dev/null || true
          done
