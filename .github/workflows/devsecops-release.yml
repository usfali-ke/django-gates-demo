# Promotion: one run per environment, the same digest all the way.
#
#   dev      the digest devsecops-pipeline.yml built and signed from this commit
#   staging  the digest running in dev, once G6 verified it there
#   prod     the digest running in staging, once G6 verified it and G3
#            passed against it there, and only after G4
#
# Each run, in order:
#
#   R1 resolve   which digest this environment may get (above) → `promotion`
#   R1 verify    signature + SBOM + SLSA provenance (for the commit that
#                built it) · evidence attestation (the pipeline's G2 + G3
#                passed for this digest) · target config (deploy/<env>):
#                schema-valid, checkov-clean, only the digest changes
#   R2 G4        prod only: protected environment `release-approval` (a
#                human who didn't start or re-run this run) AND the security
#                dashboard's decision on the change record, which includes
#                "G3 passed in staging for this digest"
#   G5           deployment gate for this environment, BEFORE anything is
#                committed: provenance, config, promotion path
#   R3 deploy    the digest committed to deploy/<env> (GitOps)
#   R4 verify    wait for the dashboard's `security-dashboard/G6` status on
#                the deploy commit (Argo CD sync + canary analysis + Kyverno)
#   G3 staging   staging only: functional · k6 · nuclei · testssl.sh against
#                the deployed staging environment, on the self-hosted runner
#                (a GitHub-hosted runner can't reach the cluster)
#   R5 evidence  every report + hash manifest → artifact `release-evidence`
#                (90 days); after a deploy, attested to the image digest
#
# Start it from main: Actions → devsecops-release → Run workflow. prod
# also needs the change request (7, #7 or CHG-7), and whoever starts (or
# re-runs) it can't be the one who approves it. Nothing here talks to the
# cluster except the staging tests: a deploy is a commit that Argo CD syncs.

name: devsecops-release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote to
        required: true
        type: choice
        options: [dev, staging, prod]
      change:
        description: prod only — change request being released (issue 7, #7 or CHG-7)
        required: false
        type: string
      kind:
        description: Deployment kind
        required: true
        type: choice
        options: [planned, hotfix, fix_forward]
        default: planned

permissions: {}

# One promotion at a time: each ends in a push to main.
concurrency:
  group: devsecops-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/usfali-ke/django-gates-demo
  TARGET_ENV: ${{ inputs.environment }}
  KUSTOMIZATION: deploy/${{ inputs.environment }}/kustomization.yaml
  # Only the pipeline on main signs releasable images.
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yml@refs/heads/main
  CERT_ISSUER: https://token.actions.githubusercontent.com
  EVIDENCE_TYPE: https://github.com/${{ github.repository }}/evidence/v1
  RELEASE_EVIDENCE_TYPE: https://github.com/${{ github.repository }}/release-evidence/v1
  RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-release.yml@refs/heads/main
  CHECKOV: bridgecrew/checkov:3.3.20@sha256:6d20ebbcde58b2dce6e3151a6771fefa4d468281fe442475455623f5799b9f53
  KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  UV_VERSION: "0.12.19"

jobs:
  resolve:
    name: R1 resolve the digest for ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      issues: read
      statuses: read
    outputs:
      change-id: ${{ steps.change.outputs.id }}
      digest: ${{ steps.digest.outputs.digest }}
      source-sha: ${{ steps.digest.outputs.source }}
      started-at: ${{ steps.digest.outputs.at }}
      promotion: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: promotion
      OUT: reports/promotion
      VERDICT_FILE: reports/promotion/verdict.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: change
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ inputs.change }}
        # Fails before anyone is asked to approve. The dashboard's G4 still
        # decides (approver ≠ author, change window); this only refuses a
        # request that can't pass.
        run: |
          set -euo pipefail
          n=$(sed -E 's/^[[:space:]]*(#|[Cc][Hh][Gg]-)?//; s/[[:space:]]*$//' <<<"$CHANGE")
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::prod needs a change request: '${CHANGE}' isn't an issue number (7, #7 or CHG-7)"; exit 1; }
          if ! issue=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}" 2>/dev/null); then
            echo "::error::CHG-${n}: issue #${n} doesn't exist — open one with the Change request form"; exit 1
          fi
          problems=$(jq -r '[
              (if .pull_request then "#\(.number) is a pull request, not a change request" else empty end),
              (if .state != "open" then "#\(.number) is \(.state)" else empty end),
              ([.labels[].name] as $l | ("change","change-approved","readiness-approved") | select(. as $x | $l | index($x) | not) | "missing label \(.)")
            ] | join("; ")' <<<"$issue")
          [ -z "$problems" ] || { echo "::error::CHG-${n}: ${problems}"; exit 1; }
          echo "id=CHG-${n}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: digest
        env:
          GH_TOKEN: ${{ github.token }}
        # dev takes this commit's image. staging and prod take what the
        # previous environment runs: the digest in its kustomization, and
        # the commit that built it from the deploy commit's Source-Commit
        # trailer (provenance and evidence-check verify both against the
        # signatures, so a hand-edited trailer can't pass). That deploy
        # commit must carry a successful G6 for the previous environment.
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fail() { { echo "status=fail"; echo "detail=$1"; echo "at=$at"; } >> "$GITHUB_OUTPUT"; exit 0; }
          case "$TARGET_ENV" in
            dev)
              digest=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:sha-${GITHUB_SHA}" 2>/dev/null) || digest=""
              [ -n "$digest" ] || fail "no image ${IMAGE}:sha-${GITHUB_SHA}: devsecops-pipeline didn't publish this commit (a gate failed, or it hasn't finished)"
              source=$GITHUB_SHA
              detail="dev gets the digest devsecops-pipeline built from ${GITHUB_SHA:0:7} (this commit)" ;;
            staging|prod)
              prev=$([ "$TARGET_ENV" = staging ] && echo dev || echo staging)
              file="deploy/${prev}/kustomization.yaml"
              deploy_sha=$(git log -1 --format=%H -- "$file")
              trailer() { git log -1 --format="%(trailers:key=$1,valueonly)" "$deploy_sha" | head -1 | tr -d '[:space:]'; }
              digest=$(git show "${deploy_sha}:${file}" | sed -nE 's/^    digest: (sha256:[0-9a-f]{64})$/\1/p')
              source=$(trailer Source-Commit)
              [ "$(trailer Environment)" = "$prev" ] && [ -n "$source" ] && [ "$(trailer Image-Digest)" = "$digest" ] \
                || fail "${file} was last changed by ${deploy_sha:0:7}, which isn't a ${prev} deploy by this workflow: promote to ${prev} first"
              git cat-file -e "${source}^{commit}" 2>/dev/null || fail "Source-Commit ${source:0:7} of ${deploy_sha:0:7} isn't in this repository"
              g6=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${deploy_sha}/statuses?per_page=100" \
                     --jq '[.[] | select(.context == "security-dashboard/G6")][0] // empty' 2>/dev/null) || g6=""
              state=$(jq -r '.state // empty' <<<"${g6:-null}")
              desc=$(jq -r '.description // ""' <<<"${g6:-null}")
              [ "$state" = success ] && [[ "$desc" == *"(${prev})"* ]] \
                || fail "${digest:0:19}… isn't verified in ${prev}: G6 on ${deploy_sha:0:7} is '${state:-missing}' ${desc}"
              detail="${TARGET_ENV} gets ${digest:0:19}… (built from ${source:0:7}), running in ${prev} since ${deploy_sha:0:7} with G6 verified (${desc})" ;;
          esac
          detail="$detail; deploys only as a GitOps commit to deploy/${TARGET_ENV} by devsecops-release.yml on main (Argo CD django-gates-demo-${TARGET_ENV})"
          { echo "status=pass"; echo "detail=$detail"; echo "digest=$digest"; echo "source=$source"; echo "at=$at"; } >> "$GITHUB_OUTPUT"
          echo "Promoting \`${IMAGE}@${digest}\` to **${TARGET_ENV}** (built from ${source:0:7})" >> "$GITHUB_STEP_SUMMARY"
      - id: verdict
        if: always()
        env:
          STATUS: ${{ steps.digest.outputs.status }}
          DETAIL: ${{ steps.digest.outputs.detail || 'resolve did not run' }}
          TOOL: git + GitHub commit statuses
        run: python3 .github/scripts/verdict.py result "$STATUS" "$DETAIL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-promotion
          path: reports/promotion/
          if-no-files-found: ignore

  provenance:
    name: R1 verify · signature, SBOM, SLSA provenance
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: provenance
      OUT: reports/provenance
      VERDICT_FILE: reports/provenance/verdict.json
      REF: ghcr.io/usfali-ke/django-gates-demo@${{ needs.resolve.outputs.digest }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # The provenance must name the commit that built this digest — a
        # valid attestation for some other build of main isn't enough.
        run: |
          mkdir -p "$OUT"
          fail=""
          id=(--certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER")
          cosign verify "${id[@]}" "$REF" > "$OUT/signature.json" || fail="$fail signature"
          cosign verify-attestation "${id[@]}" --type cyclonedx "$REF" > /dev/null || fail="$fail sbom-attestation"
          if cosign verify-attestation "${id[@]}" --type slsaprovenance1 "$REF" > "$OUT/slsa.jsonl"; then
            jq -r '.payload | @base64d | fromjson | .predicate.buildDefinition.resolvedDependencies[]?.digest.gitCommit // empty' "$OUT/slsa.jsonl" \
              | grep -qx "$SOURCE_SHA" || fail="$fail slsa-commit-mismatch"
          else
            fail="$fail slsa-attestation"
          fi
          gh attestation verify "oci://${REF}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/devsecops-pipeline.yml" --format json > "$OUT/gh-attestation.json" \
            || fail="$fail gh-attestation"
          if [ -z "$fail" ]; then
            { echo "status=pass"; echo "detail=cosign signature + CycloneDX SBOM + SLSA v1 (commit ${SOURCE_SHA:0:7}) verified for devsecops-pipeline.yml@refs/heads/main; gh attestation verify passed"; } >> "$GITHUB_OUTPUT"
          else
            { echo "status=fail"; echo "detail=verification failed:${fail}"; } >> "$GITHUB_OUTPUT"
          fi
      - id: verdict
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          DETAIL: ${{ steps.check.outputs.detail || 'verification did not run' }}
          TOOL: cosign 2.6.5 + gh attestation
        run: python3 .github/scripts/verdict.py result "$STATUS" "$DETAIL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-provenance
          path: reports/provenance/
          if-no-files-found: ignore

  evidence-check:
    name: R1 verify · pipeline evidence (G2 + G3 passed)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: evidence-check
      OUT: reports/evidence-check
      VERDICT_FILE: reports/evidence-check/verdict.json
      REF: ghcr.io/usfali-ke/django-gates-demo@${{ needs.resolve.outputs.digest }}
      DIGEST: ${{ needs.resolve.outputs.digest }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: check
        # The signed manifest is the pipeline's own record of this digest:
        # built from its source commit, every control passed, G2 and G3
        # (preprod) recorded.
        run: |
          mkdir -p "$OUT"
          if ! cosign verify-attestation --type "$EVIDENCE_TYPE" --certificate-identity "$CERT_IDENTITY" \
                 --certificate-oidc-issuer "$CERT_ISSUER" "$REF" > "$OUT/attestation.jsonl"; then
            { echo "status=fail"; echo "detail=no verified evidence attestation ($EVIDENCE_TYPE) on ${DIGEST:0:19}"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The newest attestation wins if the pipeline was re-run.
          jq -s 'map(.payload | @base64d | fromjson | .predicate) | sort_by(.generated_at) | last' "$OUT/attestation.jsonl" > "$OUT/manifest.json"
          problems=$(jq -r --arg sha "$SOURCE_SHA" --arg digest "$DIGEST" '[
              (if .commit_sha != $sha then "built from \(.commit_sha[0:7]), not \($sha[0:7])" else empty end),
              (if .artifact_digest != $digest then "manifest is for \(.artifact_digest)" else empty end),
              (if .result != "pass" then "pipeline result \(.result) (\(.counts.fail) failed, \(.counts.missing) missing)" else empty end),
              (.gates as $g | ("G2","G3") | select(($g[.].status // "") != "pass" or ($g[.].recorded // false) != true) | "\(.) not passed+recorded")
            ] | join("; ")' "$OUT/manifest.json")
          if [ -z "$problems" ]; then
            summary=$(jq -r '"\(.counts.pass) controls passed, \(.counts.skipped) skipped; G2 + G3 passed; run \(.run_url)"' "$OUT/manifest.json")
            { echo "status=pass"; echo "detail=evidence attestation verified: $summary"; } >> "$GITHUB_OUTPUT"
          else
            { echo "status=fail"; echo "detail=evidence attestation verified but: $problems"; } >> "$GITHUB_OUTPUT"
          fi
      - id: verdict
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          DETAIL: ${{ steps.check.outputs.detail || 'check did not run' }}
          TOOL: cosign verify-attestation
        run: python3 .github/scripts/verdict.py result "$STATUS" "$DETAIL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-evidence-check
          path: reports/evidence-check/
          if-no-files-found: ignore

  config:
    name: R1 verify · target config (deploy/${{ inputs.environment }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: config
      OUT: reports/config
      VERDICT_FILE: reports/config/verdict.json
      DIGEST: ${{ needs.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - id: check
        # Schema-valid (-strict rejects unknown fields; Rollout and
        # AnalysisTemplate schemas from the CRDs catalog), no checkov
        # failures, and the only change vs git is the image digest.
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          python3 .github/scripts/set_digest.py "$KUSTOMIZATION" "$DIGEST" || exit 0
          kubectl kustomize "deploy/${TARGET_ENV}" > "$OUT/${TARGET_ENV}.yaml" || exit 0
          grep -q "image: ${IMAGE}@${DIGEST}" "$OUT/${TARGET_ENV}.yaml" || { echo "::error::render does not reference the promoted digest"; exit 0; }
          docker run --rm -v "$PWD/$OUT:/render:ro" "$KUBECONFORM" \
            -strict -summary -output json -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "/render/${TARGET_ENV}.yaml" > "$OUT/kubeconform.json"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          mkdir -p "$OUT/checkov"
          uv run --no-project --with pyyaml==6.0.3 python .github/scripts/scan_view.py < "$OUT/${TARGET_ENV}.yaml" > "$OUT/checkov/scan-view.yaml"
          docker run --rm -v "$PWD/$OUT/checkov:/work" "$CHECKOV" -f /work/scan-view.yaml --framework kubernetes \
            -o json --output-file-path /work --soft-fail --quiet > /dev/null || true
          echo "changed=$(git status --porcelain | awk '{print $2}' | grep -v '^reports/' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.check.outputs.rc }}
          CHANGED: ${{ steps.check.outputs.changed }}
          TOOL: kubeconform 0.8.0 + checkov 3.3.20
        run: |
          rc=0
          CONTROL=config-schema OUTPUT=schema VERDICT_FILE="$OUT/kubeconform.verdict.json" \
            python3 .github/scripts/verdict.py kubeconform "$OUT/kubeconform.json" || rc=1
          CONTROL=config-checkov OUTPUT=checkov VERDICT_FILE="$OUT/checkov.verdict.json" \
            python3 .github/scripts/verdict.py checkov "$OUT/checkov/results_json.json" || rc=1
          status=$([ $rc = 0 ] && echo pass || echo fail)
          detail="$(jq -r .detail "$OUT/kubeconform.verdict.json" 2>/dev/null) | checkov: $(jq -r .detail "$OUT/checkov.verdict.json" 2>/dev/null)"
          python3 .github/scripts/verdict.py result "$status" "$detail"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-config
          path: reports/config/
          if-no-files-found: ignore

  g4:
    name: R2 G4 release approval (prod)
    needs: [resolve, provenance, evidence-check, config]
    if: inputs.environment == 'prod'
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
      actions: read
    env:
      DIGEST: ${{ needs.resolve.outputs.digest }}
      CHANGE_ID: ${{ needs.resolve.outputs.change-id }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
    steps:
      - name: Separation of duties
        id: sod
        env:
          GH_TOKEN: ${{ github.token }}
        # The environment approval is read back from GitHub (this attempt's
        # only). Whoever started the run or re-ran it can't be its approver,
        # so a re-run of this job needs someone who did neither. The
        # dashboard checks the same thing independently.
        run: |
          set -euo pipefail
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          approvals=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")
          started=$(jq -c '[.actor.login, .triggering_actor.login] | map(select(.)) | unique' <<<"$run")
          approved=$(jq -c '[.[] | select(.state == "approved") | .user.login] | unique' <<<"$approvals")
          self=$(jq -rn --argjson s "$started" --argjson a "$approved" '$a - ($a - $s) | join(", ")')
          if [ "$approved" = "[]" ]; then
            echo "::error::no release-approval approval recorded for this run"; exit 1
          elif [ -n "$self" ]; then
            echo "::error::approved by ${self}, who also started or re-ran this run — someone who did neither must approve"; exit 1
          fi
          echo "Started by $(jq -r 'join(", ")' <<<"$started"), approved by $(jq -r 'join(", ")' <<<"$approved")" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "started=$started"; echo "approved=$approved"; } >> "$GITHUB_OUTPUT"
      - env:
          STARTED: ${{ steps.sod.outputs.started }}
          APPROVED: ${{ steps.sod.outputs.approved }}
        # commit_sha is this run's commit (the dashboard only answers on
        # it); source_commit is the commit that built the digest.
        run: |
          mkdir -p "$RUNNER_TEMP/release-request"
          jq -n --arg change "$CHANGE_ID" --arg subject "$DIGEST" --arg sha "$GITHUB_SHA" --arg source "$SOURCE_SHA" \
            --argjson started "$STARTED" --argjson approved "$APPROVED" \
            '{change_id: $change, subject: $subject, commit_sha: $sha, source_commit: $source, environment: "prod",
              started_by: $started, approved_by: $approved}' \
            | tee "$RUNNER_TEMP/release-request/release-request.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request
          path: ${{ runner.temp }}/release-request/release-request.json
          if-no-files-found: error
          retention-days: 90
      - name: Wait for the dashboard's G4 decision
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Only a status pointing at this run answers this request; an older
        # G4 status on the same commit belongs to another release.
        run: |
          set -uo pipefail
          for _ in $(seq 60); do
            s=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/statuses?per_page=100" \
                  --jq "[.[] | select(.context == \"security-dashboard/G4\" and .target_url == \"${RUN_URL}\")][0] // empty" 2>/dev/null)
            case "$(jq -r '.state // empty' <<<"${s:-null}")" in
              success) echo "G4: $(jq -r .description <<<"$s")" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              failure|error) echo "::error::$(jq -r '.description // "G4 blocked"' <<<"$s")"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::dashboard collector did not answer within 20 minutes (no security-dashboard/G4 status for this run)"
          exit 1

  gate-g5:
    name: G5 deployment gate (${{ inputs.environment }})
    # Before the deploy commit: nothing reaches an environment unless G5
    # passed for it. prod also needs G4 first.
    needs: [resolve, provenance, evidence-check, config, g4]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.g4.result == 'success' || (inputs.environment != 'prod' && needs.g4.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/gate
        with:
          gate: G5
          needs: ${{ toJSON(needs) }}
          subject: ${{ needs.resolve.outputs.digest }}
          commit-sha: ${{ needs.resolve.outputs.source-sha }}
          artifact-digest: ${{ needs.resolve.outputs.digest }}
          environment: ${{ inputs.environment }}
          started-at: ${{ needs.resolve.outputs.started-at }}

  deploy:
    name: R3 deploy to ${{ inputs.environment }} (GitOps commit)
    # The only write path to the cluster: a commit on main that Argo CD
    # syncs. [skip ci] + paths-ignore keep it from re-running the pipeline.
    needs: [resolve, gate-g5]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      gitops-sha: ${{ steps.commit.outputs.gitops_sha }}
    env:
      CONTROL: deploy
      OUT: reports/deploy
      VERDICT_FILE: reports/deploy/verdict.json
      DIGEST: ${{ needs.resolve.outputs.digest }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
      CHANGE_ID: ${{ needs.resolve.outputs.change-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes the deploy commit
          fetch-depth: 0
      - id: commit
        # On main as it is now (an earlier promotion may have pushed since
        # this run started), but only if what config verified — the base
        # and this environment's overlay — hasn't changed since.
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- deploy/base "deploy/${TARGET_ENV}"; then
            echo "::error::deploy/base or deploy/${TARGET_ENV} changed on main since ${GITHUB_SHA:0:7}; start a new run"; exit 1
          fi
          git checkout -q -B main origin/main
          python3 .github/scripts/set_digest.py "$KUSTOMIZATION" "$DIGEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION"
          # The trailers are what the next environment's resolve reads.
          git commit -m "deploy(${TARGET_ENV}): django-gates-demo ${DIGEST:7:12}${CHANGE_ID:+ ${CHANGE_ID}} [skip ci]" \
            -m "Promoted ${IMAGE}@${DIGEST} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --trailer "Environment: ${TARGET_ENV}" --trailer "Image-Digest: ${DIGEST}" --trailer "Source-Commit: ${SOURCE_SHA}"
          git push origin HEAD:main
          echo "gitops_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          SHA: ${{ steps.commit.outputs.gitops_sha }}
          TOOL: git (GitOps) → Argo CD
        run: |
          mkdir -p "$OUT"
          if [ -n "$SHA" ]; then
            python3 .github/scripts/verdict.py result pass "GitOps commit ${SHA:0:7} on main → Argo CD app django-gates-demo-${TARGET_ENV} (automated sync)"
          else
            python3 .github/scripts/verdict.py result fail "GitOps commit/push to main failed"
          fi
      - name: Build deployment-event
        if: steps.commit.outputs.gitops_sha != ''
        env:
          GITOPS_SHA: ${{ steps.commit.outputs.gitops_sha }}
          KIND: ${{ inputs.kind }}
        # in_progress: the commit is only the start. Argo CD notifications
        # report the sync/canary outcome under the same external_id
        # (deploy-<dashboard.environment>-<revision>). commit_sha is the
        # commit that built the digest, so lead time runs from there.
        run: |
          mkdir -p "$RUNNER_TEMP/deployment-event"
          jq -n \
            --arg id "deploy-${TARGET_ENV}-${GITOPS_SHA}" --arg env "$TARGET_ENV" --arg change "$CHANGE_ID" --arg sha "$SOURCE_SHA" \
            --arg digest "$DIGEST" --arg commit_at "$(git show -s --format=%cI "$SOURCE_SHA")" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg kind "$KIND" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{external_id: $id, environment: $env, change_id: (if $change == "" then null else $change end), commit_sha: $sha,
              artifact_digest: $digest, commit_at: $commit_at, started_at: $started,
              status: "in_progress", kind: $kind, via_approved_path: true, break_glass: false,
              run_url: $run}' | tee "$RUNNER_TEMP/deployment-event/deployment.json"
          cp "$RUNNER_TEMP/deployment-event/deployment.json" "$OUT/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.commit.outputs.gitops_sha != ''
        with:
          name: deployment-event
          path: ${{ runner.temp }}/deployment-event/deployment.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-deploy
          path: reports/deploy/
          if-no-files-found: ignore

  post-deploy:
    name: R4 verify the rollout in ${{ inputs.environment }} (G6)
    # Argo CD reports G6 (sync, canary analysis, Kyverno admission) to the
    # dashboard; the dashboard mirrors it as commit status
    # `security-dashboard/G6` on the deploy commit, naming the environment
    # in the description. A GitHub-hosted runner can't see the cluster, so
    # this is how the promotion learns the outcome.
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: post-deploy
      OUT: reports/post-deploy
      VERDICT_FILE: reports/post-deploy/verdict.json
      GITOPS_SHA: ${{ needs.deploy.outputs.gitops-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          for _ in $(seq 90); do
            s=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITOPS_SHA}/statuses?per_page=100" \
                  --jq '[.[] | select(.context == "security-dashboard/G6")][0] // empty' 2>/dev/null)
            state=$(jq -r '.state // empty' <<<"${s:-null}")
            desc=$(jq -r '.description // ""' <<<"${s:-null}")
            if [[ "$desc" == *"(${TARGET_ENV})"* ]] && { [ "$state" = success ] || [ "$state" = failure ] || [ "$state" = error ]; }; then
              jq . <<<"$s" > "$OUT/g6-status.json"
              { echo "status=$([ "$state" = success ] && echo pass || echo fail)"
                echo "detail=G6 ${state}: ${desc} ($(jq -r '.target_url // ""' <<<"$s"))"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          { echo "status=fail"; echo "detail=no security-dashboard/G6 status for ${TARGET_ENV} on ${GITOPS_SHA:0:7} within 30 minutes (Argo CD sync or notification didn't reach the dashboard)"; } >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          STATUS: ${{ steps.wait.outputs.status }}
          DETAIL: ${{ steps.wait.outputs.detail || 'wait did not run' }}
          TOOL: security dashboard (Argo CD notifications)
        run: python3 .github/scripts/verdict.py result "$STATUS" "$DETAIL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-post-deploy
          path: reports/post-deploy/
          if-no-files-found: ignore

  staging-g3:
    name: G3 test gate in staging
    # One job, so one ephemeral self-hosted runner registration covers it
    # (see README: "Staging test runner"). The runner's own environment
    # supplies KUBECONFIG, scoped to port-forward and exec in the staging
    # namespace; the repo holds no cluster credential.
    needs: [resolve, post-deploy]
    if: inputs.environment == 'staging' && needs.post-deploy.result == 'success'
    runs-on: [self-hosted, linux, django-gates-demo-staging]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NS: django-gates-demo-staging
      DIGEST: ${{ needs.resolve.outputs.digest }}
      OUT: reports/staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool pins (the pipeline's)
        # Same scanners and thresholds as the preprod G3, read from the
        # pipeline so the two can't drift.
        run: |
          set -euo pipefail
          for k in K6 NUCLEI NUCLEI_TEMPLATES NUCLEI_TEMPLATES_COMMIT TESTSSL SLO_P95_MS; do
            v=$(sed -nE "s/^  ${k}: \"?([^\"]+)\"?$/\1/p" .github/workflows/devsecops-pipeline.yml)
            [ -n "$v" ] || { echo "::error::no ${k} in devsecops-pipeline.yml"; exit 1; }
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done
          echo "CADDY=$(sed -nE 's/^    image: (caddy:.*)$/\1/p' tests/preprod/compose.yaml)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Reach staging
        id: up
        # The pod under test must run the promoted digest. Two fresh
        # random-password users, created in that pod (the demo's SQLite is
        # per pod) with the password on stdin, never in argv. Secrets go
        # to a 0600 file, as in the preprod action.
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          pods=$(kubectl -n "$NS" get pods -l app=django-gates-demo -o json)
          pod=$(jq -r --arg d "$DIGEST" '[.items[] | select(.status.phase == "Running")
                 | select(any((.status.containerStatuses // [])[]; .ready and (.imageID | endswith($d))))][0].metadata.name // empty' <<<"$pods")
          [ -n "$pod" ] || { echo "::error::no ready pod in ${NS} runs ${DIGEST}"; jq -r '.items[] | "\(.metadata.name) \(.status.containerStatuses[0].imageID)"' <<<"$pods"; exit 1; }
          echo "Testing pod ${pod} (${DIGEST:0:19}…) in ${NS}" | tee -a "$GITHUB_STEP_SUMMARY"
          nohup kubectl -n "$NS" port-forward "pod/${pod}" 18000:8000 > "$OUT/port-forward.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/port-forward.pid"
          rand() { python3 -c 'import secrets; print(secrets.token_urlsafe(24))'; }
          env_file="$RUNNER_TEMP/staging.env"
          (umask 077; {
            echo "USER_A=staging-alice"; echo "PASSWORD_A=$(rand)"
            echo "USER_B=staging-bob"; echo "PASSWORD_B=$(rand)"
            echo "BASE_URL=https://localhost:8443"; echo "HTTP_URL=http://localhost:8480"
            echo "REQUESTS_CA_BUNDLE=$RUNNER_TEMP/staging-bundle.crt"
            echo "SSL_CERT_FILE=$RUNNER_TEMP/staging-bundle.crt"; } > "$env_file")
          # shellcheck source=/dev/null
          set -a; . "$RUNNER_TEMP/staging.env"; set +a
          for u in A B; do
            user="USER_$u"; pw="PASSWORD_$u"
            # shellcheck disable=SC2016 # $0 expands in the pod's shell
            kubectl -n "$NS" exec -i "$pod" -- sh -c 'read -r ENSURE_USER_PASSWORD; export ENSURE_USER_PASSWORD; exec python manage.py ensure_user "$0"' "${!user}" <<<"${!pw}"
          done
          docker run -d --name "staging-proxy-${GITHUB_RUN_ID}" --network host --cap-drop ALL \
            -v "$PWD/tests/staging/Caddyfile:/etc/caddy/Caddyfile:ro" "$CADDY" > /dev/null
          for _ in $(seq 30); do
            docker cp "staging-proxy-${GITHUB_RUN_ID}:/data/caddy/pki/authorities/local/root.crt" "$RUNNER_TEMP/staging-ca.crt" 2>/dev/null \
              && curl -fsS --cacert "$RUNNER_TEMP/staging-ca.crt" -o /dev/null https://localhost:8443/healthz && break
            sleep 2
          done
          curl -fsS --cacert "$RUNNER_TEMP/staging-ca.crt" -o /dev/null https://localhost:8443/healthz
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/staging-ca.crt" > "$RUNNER_TEMP/staging-bundle.crt"
          chmod 644 "$RUNNER_TEMP/staging-ca.crt" "$RUNNER_TEMP/staging-bundle.crt"   # read by tool containers running as other uids
      - name: functional tests
        id: functional-run
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          mkdir -p "$OUT/functional"
          # shellcheck source=/dev/null
          set -a; . "$RUNNER_TEMP/staging.env"; set +a
          rc=0
          uv sync --frozen || rc=$?
          uv run --frozen pytest tests/functional -p no:cacheprovider --junitxml="$OUT/functional/junit.xml" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: functional
        if: ${{ !cancelled() }}
        env:
          CONTROL: functional
          VERDICT_FILE: reports/staging/functional/verdict.json
          RC: ${{ steps.functional-run.outputs.rc }}
          LABEL: tests/functional against staging (${{ env.NS }})
          TOOL: pytest + requests
        run: python3 .github/scripts/verdict.py tests "$OUT/functional/junit.xml"
      - name: k6 load
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          mkdir -p "$OUT/performance" && chmod 777 "$OUT/performance"
          # shellcheck source=/dev/null
          set -a; . "$RUNNER_TEMP/staging.env"; set +a
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD/tests/perf:/perf:ro" -v "$PWD/$OUT/performance:/out" -v "$SSL_CERT_FILE:/ca.crt:ro" \
            -e SSL_CERT_FILE=/ca.crt -e BASE_URL -e USER_A -e PASSWORD_A -e SUMMARY_OUT=/out/k6-summary.json \
            "$K6" run --quiet /perf/load.js || true
      - id: performance
        if: ${{ !cancelled() }}
        env:
          CONTROL: performance
          VERDICT_FILE: reports/staging/performance/verdict.json
          TOOL: k6 (10 VUs, 30 s) against staging
        run: python3 .github/scripts/verdict.py k6 "$OUT/performance/k6-summary.json"
      - name: nuclei
        id: nuclei-run
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          set -uo pipefail
          mkdir -p "$OUT/dast-nuclei" && chmod 777 "$OUT/dast-nuclei"
          rm -rf "$RUNNER_TEMP/templates"
          git clone -q --depth 1 --branch "$NUCLEI_TEMPLATES" https://github.com/projectdiscovery/nuclei-templates.git "$RUNNER_TEMP/templates"
          got=$(git -C "$RUNNER_TEMP/templates" rev-parse HEAD)
          [ "$got" = "$NUCLEI_TEMPLATES_COMMIT" ] || { echo "::error::nuclei-templates $NUCLEI_TEMPLATES is $got, pinned $NUCLEI_TEMPLATES_COMMIT"; exit 0; }
          touch "$OUT/dast-nuclei/nuclei.jsonl"
          docker run --rm --network host -v "$RUNNER_TEMP/templates:/templates:ro" -v "$PWD/$OUT/dast-nuclei:/out" "$NUCLEI" \
            -u https://localhost:8443 -t /templates -disable-update-check -duc -exclude-tags dos,fuzz,intrusive,osint \
            -rate-limit 100 -timeout 5 -no-color -silent -jsonl -o /out/nuclei.jsonl > "$OUT/dast-nuclei/nuclei.log" 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - id: dast-nuclei
        if: ${{ !cancelled() }}
        env:
          CONTROL: dast-nuclei
          VERDICT_FILE: reports/staging/dast-nuclei/verdict.json
          RC: ${{ steps.nuclei-run.outputs.rc }}
          TOOL: nuclei against staging
          TEMPLATES: ${{ env.NUCLEI_TEMPLATES }}
        run: python3 .github/scripts/verdict.py nuclei "$OUT/dast-nuclei/nuclei.jsonl"
      - name: testssl.sh
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        # The TLS endpoint is the runner's stand-in ingress
        # (tests/staging/Caddyfile), the same proxy config preprod tests.
        run: |
          mkdir -p "$OUT/dast-tls" && chmod 777 "$OUT/dast-tls"
          docker run --rm --network host -v "$PWD/$OUT/dast-tls:/out" -v "$RUNNER_TEMP/staging-ca.crt:/ca.crt:ro" "$TESTSSL" \
            --quiet --color 0 --warnings off --add-ca /ca.crt \
            --jsonfile-pretty /out/testssl.json https://localhost:8443 > "$OUT/dast-tls/testssl.log" 2>&1 || true
      - id: dast-tls
        if: ${{ !cancelled() }}
        env:
          CONTROL: dast-tls
          VERDICT_FILE: reports/staging/dast-tls/verdict.json
          TOOL: testssl.sh against staging's stand-in ingress
        run: python3 .github/scripts/verdict.py testssl "$OUT/dast-tls/testssl.json"
      - name: tool report
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/findings.py native "$OUT/dast-tls/testssl.log"
      - uses: ./.github/actions/gate
        if: ${{ !cancelled() }}
        with:
          gate: G3
          profile: staging
          needs: ${{ toJSON(steps) }}
          subject: ${{ needs.resolve.outputs.digest }}
          commit-sha: ${{ needs.resolve.outputs.source-sha }}
          artifact-digest: ${{ needs.resolve.outputs.digest }}
          environment: staging
      - name: Tear down
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/port-forward.pid" ] && kill "$(cat "$RUNNER_TEMP/port-forward.pid")" 2>/dev/null || true
          docker logs "staging-proxy-${GITHUB_RUN_ID}" > "$OUT/proxy.log" 2>&1 || true
          docker rm -f "staging-proxy-${GITHUB_RUN_ID}" > /dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/staging.env"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-staging-g3
          path: reports/staging/
          if-no-files-found: ignore

  release-evidence:
    name: R5 release evidence
    needs: [resolve, provenance, evidence-check, config, g4, gate-g5, deploy, post-deploy, staging-g3]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DIGEST: ${{ needs.resolve.outputs.digest }}
      CHANGE_ID: ${{ needs.resolve.outputs.change-id }}
      REF: ghcr.io/usfali-ke/django-gates-demo@${{ needs.resolve.outputs.digest }}
      CONTROLS: promotion,provenance,evidence-check,config,deploy,post-deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-*
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.environment == 'prod'
        continue-on-error: true
        with:
          name: release-request
          path: ${{ runner.temp }}/in/release-request
      - name: Bundle + hash manifest
        env:
          G4_RESULT: ${{ needs.g4.result }}
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence.py "$RUNNER_TEMP/in" release-evidence
          cp "$RUNNER_TEMP/in/release-request/release-request.json" release-evidence/ 2>/dev/null || true
          jq --arg change "$CHANGE_ID" --arg g4 "$G4_RESULT" --arg env "$TARGET_ENV" \
            '. + {environment: $env, change_id: (if $change == "" then null else $change end), g4_job: $g4}' \
            release-evidence/manifest.json > "$RUNNER_TEMP/m.json" && mv "$RUNNER_TEMP/m.json" release-evidence/manifest.json
          (cd release-evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
          if-no-files-found: error
      - if: needs.deploy.result == 'success'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - if: needs.deploy.result == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: needs.deploy.result == 'success'
        name: Attest the release record to the image digest
        run: |
          set -euo pipefail
          cosign attest --yes --type "$RELEASE_EVIDENCE_TYPE" --predicate release-evidence/manifest.json "$REF"
          cosign verify-attestation --type "$RELEASE_EVIDENCE_TYPE" --certificate-identity "$RELEASE_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" "$REF" > /dev/null
          echo "Release record (${TARGET_ENV}) attested to ${REF} (${RELEASE_EVIDENCE_TYPE})" >> "$GITHUB_STEP_SUMMARY"
