# CI — stage 1 of the release pipeline, from commit to a signed artifact,
# in ONE run. Every control is its own job and keeps its report as
# evidence, so the run shows what passed and what failed.
#
#   1 build      build ×2 (reproducible?) → image artifact │ unit tests + coverage
#                │ code quality (ruff: lint + complexity threshold)
#   2 static     semgrep · gitleaks · trufflehog · trivy (SCA, lockfile) · checkov
#                │ PR: reviewers · signed commits
#     image      trivy (image) · syft SBOM · dockle · django check --deploy (on the built image)
#   3 package    main only, and only if every stage-1/2 control passed: push the
#                exact built digest to the artifact repository (GHCR), cosign
#                sign + SBOM/SLSA attestations
#     ── G1 (PR merge gate) · G2 Control Gate: build successful, all tests
#        passed, code quality threshold met, every scan clean ──
#   4 evidence   every report + hash manifest → artifact `evidence` (90 days);
#                on main, attested to the image digest with cosign
#   5 release    main, published and the Control Gate passed: starts
#                devsecops-release.yml for this commit (deploy to dev → approval
#                → staging → approval → prod)
#
# Nothing dynamic runs here: integration, end-to-end, performance and DAST
# tests run in the release pipeline, against each environment after this
# digest is deployed to it — never against an image nobody deployed.
#
# Rules that make the results trustworthy:
#  - Tools never decide pass/fail (they run "don't fail on findings");
#    .github/scripts/verdict.py applies the threshold, records the verdict
#    in the report, and fails the job. A missing report is a fail.
#  - Exceptions live in security/accepted-risks.json, each with a reason
#    and an expiry, and every verdict lists the ones it applied.
#  - Nothing is rebuilt: stage 2 tests the `image` artifact from build,
#    checked against its digest, and publish pushes those same bytes; the
#    release deploys that digest.
#  - Every image and action is pinned by digest/SHA.
#  - G1 goes to the security dashboard on pull requests, G2 on pushes to
#    main (artifact `gate-result-<G>`). Elsewhere they're `gate-preview-<G>`.

name: devsecops-pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
    # Deploy commits (devsecops-stage.yml) change only deploy/**. To
    # release a deploy/-only or docs-only change, run this workflow on
    # main by hand: it publishes like a push.
    paths-ignore: ["deploy/**", "**.md"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: devsecops-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  IMAGE: ghcr.io/usfali-ke/django-gates-demo
  IMAGE_TAG: django-gates-demo:ci
  BASE_IMAGE: python:3.13-slim@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
  SRC_DIRS: config notes manage.py gunicorn.conf.py
  LOCKFILE: uv.lock
  COVERAGE_THRESHOLD: "90"
  UV_VERSION: "0.12.19"
  SEMGREP: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
  GITLEAKS: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRUFFLEHOG: trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
  CHECKOV: bridgecrew/checkov:3.3.20@sha256:6d20ebbcde58b2dce6e3151a6771fefa4d468281fe442475455623f5799b9f53
  TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  SYFT: anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
  DOCKLE: goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ── 1 build ────────────────────────────────────────────────────────────
  build:
    name: 1 build (reproducible)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.repro.outputs.d1 }}
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: build
      OUT: reports/build
      VERDICT_FILE: reports/build/verdict.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: repro
        name: Build twice, compare digests
        # SOURCE_DATE_EPOCH = commit time, timestamps rewritten, no BuildKit
        # provenance/SBOM (they embed build time); the second build ignores
        # the cache. Both on this runner: deterministic here, not proof an
        # independent rebuilder gets the same bytes.
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          common=(--provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH -t "$IMAGE_TAG"
                  --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
                  --label "org.opencontainers.image.revision=${GITHUB_SHA}")
          rc=0
          docker buildx build "${common[@]}" --output "type=oci,dest=image.oci.tar,rewrite-timestamp=true" --metadata-file "$OUT/build-1.json" . || rc=1
          docker buildx build "${common[@]}" --no-cache --output "type=oci,dest=rebuild.oci.tar,rewrite-timestamp=true" --metadata-file "$OUT/build-2.json" . || rc=1
          { echo "rc=$rc"
            echo "d1=$(jq -r '."containerimage.digest" // empty' "$OUT/build-1.json" 2>/dev/null)"
            echo "d2=$(jq -r '."containerimage.digest" // empty' "$OUT/build-2.json" 2>/dev/null)"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.repro.outputs.d1 != ''
        with:
          name: image
          path: image.oci.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.repro.outputs.rc }}
          D1: ${{ steps.repro.outputs.d1 }}
          D2: ${{ steps.repro.outputs.d2 }}
          TOOL: docker buildx (BuildKit, OCI exporter)
        run: python3 .github/scripts/verdict.py build Dockerfile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-build
          path: reports/build/
          if-no-files-found: ignore

  unit-tests:
    name: 1 unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.tests.outputs.result }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - id: run
        run: |
          mkdir -p reports/unit-tests reports/coverage
          rc=0
          uv sync --frozen || rc=$?
          uv run --frozen pytest --junitxml=reports/unit-tests/junit.xml \
            --cov --cov-report=xml:reports/coverage/coverage.xml --cov-report=term || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: tests
        if: always()
        env:
          CONTROL: unit-tests
          VERDICT_FILE: reports/unit-tests/verdict.json
          RC: ${{ steps.run.outputs.rc }}
          LABEL: tests/unit
          TOOL: pytest + pytest-django
        run: python3 .github/scripts/verdict.py tests reports/unit-tests/junit.xml
      - id: coverage
        if: always()
        env:
          CONTROL: coverage
          VERDICT_FILE: reports/coverage/verdict.json
          OUTPUT: coverage
          TOOL: pytest-cov
        run: python3 .github/scripts/verdict.py coverage reports/coverage/coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-unit-tests
          path: reports/unit-tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-coverage
          path: reports/coverage/
          if-no-files-found: ignore

  code-quality:
    name: 1 code quality · ruff (lint + complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: code-quality
      OUT: reports/code-quality
      VERDICT_FILE: reports/code-quality/verdict.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # ruff is a locked dev dependency; the rules and the complexity limit
      # are pyproject.toml [tool.ruff.lint], so the threshold is versioned
      # with the code it applies to.
      - run: |
          mkdir -p "$OUT"
          # shellcheck disable=SC2086 # SRC_DIRS is a list
          uv run --frozen ruff check --output-format json $SRC_DIRS tests > "$OUT/ruff.json" || true
          # shellcheck disable=SC2086
          uv run --frozen ruff check --output-format concise $SRC_DIRS tests > "$OUT/ruff.txt" || true
      - id: verdict
        if: always()
        env:
          TOOL: ruff (pyproject.toml [tool.ruff.lint])
        run: python3 .github/scripts/verdict.py ruff "$OUT/ruff.json"
      - name: tool report
        if: always()
        run: python3 .github/scripts/findings.py native "$OUT/ruff.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-code-quality
          path: reports/code-quality/
          if-no-files-found: ignore

  # ── 2 static ───────────────────────────────────────────────────────────
  sast-semgrep:
    name: 2 SAST · semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: sast-semgrep
      OUT: reports/sast-semgrep
      VERDICT_FILE: reports/sast-semgrep/verdict.json
      NATIVE: reports/sast-semgrep/semgrep.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$OUT"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/$OUT:/out" -w /src "$SEMGREP" semgrep scan \
            --config p/default --config p/python --config p/django --config p/dockerfile --config p/github-actions \
            --metrics=off --json-output=/out/semgrep.json --sarif-output=/out/semgrep.sarif --text-output=/out/semgrep.txt -q || true
      - id: verdict
        if: always()
        env:
          TOOL: semgrep 1.177.0 (p/default, python, django, dockerfile, github-actions)
        run: python3 .github/scripts/verdict.py semgrep "$OUT/semgrep.json"
      # The tool's own report under the verdict (findings.py native).
      - name: tool report
        if: always()
        run: python3 .github/scripts/findings.py native "$NATIVE"
      # Code scanning: the same findings inline on the PR diff and in the
      # Security tab. Public repos only (private ones need GitHub Advanced
      # Security); a fork PR's token can't write, hence continue-on-error.
      - if: ${{ always() && !github.event.repository.private && hashFiles('reports/sast-semgrep/findings.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: reports/sast-semgrep/findings.sarif
          category: semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-sast-semgrep
          path: reports/sast-semgrep/
          if-no-files-found: ignore

  secrets-gitleaks:
    name: 2 secrets · gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: secrets-gitleaks
      OUT: reports/secrets-gitleaks
      VERDICT_FILE: reports/secrets-gitleaks/verdict.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir -p "$OUT"
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS" git /repo --redact --verbose --no-color \
            --report-format json --report-path "/repo/$OUT/gitleaks.json" --exit-code 0 || true
      - id: verdict
        if: always()
        env:
          TOOL: gitleaks 8.30.1
          SCOPE: every commit reachable from this ref
        run: python3 .github/scripts/verdict.py gitleaks "$OUT/gitleaks.json"
      # Code scanning, as in sast-semgrep.
      - if: ${{ always() && !github.event.repository.private && hashFiles('reports/secrets-gitleaks/findings.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: reports/secrets-gitleaks/findings.sarif
          category: secrets-gitleaks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-secrets-gitleaks
          path: reports/secrets-gitleaks/
          if-no-files-found: ignore

  secrets-trufflehog:
    name: 2 secrets · trufflehog (verified)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: secrets-trufflehog
      OUT: reports/secrets-trufflehog
      VERDICT_FILE: reports/secrets-trufflehog/verdict.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scan
        # Verification calls each candidate's own API to see if it is live.
        # The secret values are dropped before anything is stored.
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          docker run --rm -v "$PWD:/repo:ro" "$TRUFFLEHOG" git file:///repo --json --no-update \
            --results=verified,unknown,unverified > raw.jsonl
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          jq -c 'select(.DetectorName) | del(.Raw, .RawV2) | .ExtraData = null' raw.jsonl > "$OUT/trufflehog.jsonl"
          rm -f raw.jsonl
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.scan.outputs.rc }}
          TOOL: trufflehog 3.97.9
        run: python3 .github/scripts/verdict.py trufflehog "$OUT/trufflehog.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-secrets-trufflehog
          path: reports/secrets-trufflehog/
          if-no-files-found: ignore

  sca-trivy:
    name: 2 SCA · trivy (lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: sca-trivy
      OUT: reports/sca-trivy
      VERDICT_FILE: reports/sca-trivy/verdict.json
      NATIVE: reports/sca-trivy/trivy-fs.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$OUT"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/$OUT:/out" -v trivy-cache:/root/.cache/trivy "$TRIVY" \
            fs --scanners vuln --list-all-pkgs --include-dev-deps --format json --output /out/trivy-fs.json --exit-code 0 -q /src || true
      - id: verdict
        if: always()
        env:
          TOOL: trivy 0.74.0 (fs, lockfile incl. dev dependencies)
        run: python3 .github/scripts/verdict.py trivy-fs "$OUT/trivy-fs.json"
      # trivy's table from the same JSON (no second scan): the severities
      # that block, minus the accepted risks.
      - name: tool report
        if: always()
        run: |
          touch "$OUT/accepted-ids.txt"
          docker run --rm -v "$PWD/$OUT:/out" "$TRIVY" convert --format table --severity CRITICAL,HIGH,UNKNOWN \
            --ignorefile /out/accepted-ids.txt --output /out/trivy-fs.txt /out/trivy-fs.json -q || true
          python3 .github/scripts/findings.py native "$NATIVE"
      # Code scanning, as in sast-semgrep.
      - if: ${{ always() && !github.event.repository.private && hashFiles('reports/sca-trivy/findings.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: reports/sca-trivy/findings.sarif
          category: sca-trivy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-sca-trivy
          path: reports/sca-trivy/
          if-no-files-found: ignore

  iac-checkov:
    name: 2 IaC · checkov (Dockerfile + k8s render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: iac-checkov
      OUT: reports/iac-checkov
      VERDICT_FILE: reports/iac-checkov/verdict.json
      NATIVE: reports/iac-checkov/results_github_failed_only.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: |
          set -uo pipefail
          mkdir -p "$OUT/input"
          cp Dockerfile "$OUT/input/Dockerfile"
          # checkov skips CRDs, so the Rollout is scanned as the Deployment
          # it is equivalent to (scan_view.py) — never applied.
          # Prod's render: every overlay is deploy/base plus names and a digest.
          kubectl kustomize deploy/prod | uv run --no-project --with pyyaml==6.0.3 python .github/scripts/scan_view.py > "$OUT/input/prod.yaml" || exit 0
          docker run --rm -v "$PWD/$OUT:/work" "$CHECKOV" -f /work/input/prod.yaml -f /work/input/Dockerfile \
            --framework kubernetes dockerfile -o cli -o github_failed_only -o json --output-file-path /work --soft-fail --quiet > /dev/null || true
          mv "$OUT/results_json.json" "$OUT/checkov.json" || true
          cat "$OUT/results_cli.txt" 2>/dev/null || true
      - id: verdict
        if: always()
        env:
          TOOL: checkov 3.3.20
        run: python3 .github/scripts/verdict.py checkov "$OUT/checkov.json"
      # The tool's own report under the verdict (findings.py native).
      - name: tool report
        if: always()
        run: python3 .github/scripts/findings.py native "$NATIVE"
      # Code scanning, as in sast-semgrep.
      - if: ${{ always() && !github.event.repository.private && hashFiles('reports/iac-checkov/findings.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: reports/iac-checkov/findings.sarif
          category: iac-checkov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-iac-checkov
          path: reports/iac-checkov/
          if-no-files-found: ignore

  reviewers:
    name: 2 governance · reviewers
    if: startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: reviewers
      OUT: reports/reviewers
      VERDICT_FILE: reports/reviewers/verdict.json
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '.[] | tojson' > "$OUT/reviews.jsonl"
      - id: verdict
        if: always()
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_APPROVALS: "1"
          TOOL: GitHub pull request reviews API
        run: python3 .github/scripts/verdict.py reviewers "$OUT/reviews.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-reviewers
          path: reports/reviewers/
          if-no-files-found: ignore

  commits-signed:
    name: 2 governance · signed commits
    if: startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: commits-signed
      OUT: reports/commits-signed
      VERDICT_FILE: reports/commits-signed/verdict.json
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      # GitHub's own verification (signature by a key registered to the
      # committer) — not merely "has a signature".
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | [.sha[0:7], (.commit.verification.verified|tostring), .commit.verification.reason] | @tsv' > "$OUT/commits.tsv"
      - id: verdict
        if: always()
        env:
          TOOL: GitHub commit verification
        run: python3 .github/scripts/verdict.py commits "$OUT/commits.tsv"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-commits-signed
          path: reports/commits-signed/
          if-no-files-found: ignore

  # ── 2 image (scans the built image artifact, whatever the build verdict) ─
  image-scan:
    name: 2 image · trivy
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: image-scan
      OUT: reports/image-scan
      VERDICT_FILE: reports/image-scan/verdict.json
      NATIVE: reports/image-scan/trivy.txt
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - run: |
          set -uo pipefail
          mkdir -p "$OUT" "$RUNNER_TEMP/oci"
          tar -xf "$RUNNER_TEMP/image/image.oci.tar" -C "$RUNNER_TEMP/oci"
          got=$(jq -r '.manifests[0].digest' "$RUNNER_TEMP/oci/index.json")
          [ "$got" = "$DIGEST" ] || { echo "::error::image artifact is $got, the build said $DIGEST"; exit 0; }
          docker run --rm -v "$RUNNER_TEMP/oci:/oci:ro" -v "$PWD/$OUT:/out" -v trivy-cache:/root/.cache/trivy "$TRIVY" \
            image --input /oci --scanners vuln,secret --severity CRITICAL,HIGH --format json --output /out/trivy.json --exit-code 0 -q || true
          docker run --rm -v "$PWD/$OUT:/out" -v trivy-cache:/root/.cache/trivy "$TRIVY" \
            convert --format sarif --output /out/trivy.sarif /out/trivy.json -q || true
      - id: verdict
        if: always()
        env:
          TOOL: trivy 0.74.0 (OS + Python packages, secrets)
        run: python3 .github/scripts/verdict.py trivy "$OUT/trivy.json"
      # As in sca-trivy: trivy's table from the same JSON, minus accepted risks.
      - name: tool report
        if: always()
        run: |
          touch "$OUT/accepted-ids.txt"
          docker run --rm -v "$PWD/$OUT:/out" "$TRIVY" convert --format table \
            --ignorefile /out/accepted-ids.txt --output /out/trivy.txt /out/trivy.json -q || true
          python3 .github/scripts/findings.py native "$NATIVE"
      # Code scanning, as in sast-semgrep.
      - if: ${{ always() && !github.event.repository.private && hashFiles('reports/image-scan/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: reports/image-scan/trivy.sarif
          category: trivy-image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-image-scan
          path: reports/image-scan/
          if-no-files-found: ignore

  sbom:
    name: 2 image · SBOM (syft)
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: sbom
      OUT: reports/sbom
      VERDICT_FILE: reports/sbom/verdict.json
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - run: |
          set -uo pipefail
          mkdir -p "$OUT"
          got=$(tar -xOf "$RUNNER_TEMP/image/image.oci.tar" index.json | jq -r '.manifests[0].digest')
          [ "$got" = "$DIGEST" ] || { echo "::error::image artifact is $got, the build said $DIGEST"; exit 0; }
          docker run --rm -v "$RUNNER_TEMP/image:/image:ro" -v "$PWD/$OUT:/out" "$SYFT" \
            oci-archive:/image/image.oci.tar -q -o cyclonedx-json=/out/sbom.cdx.json || true
      - id: verdict
        if: always()
        env:
          TOOL: syft 1.52.0
        run: python3 .github/scripts/verdict.py sbom "$OUT/sbom.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-sbom
          path: reports/sbom/
          if-no-files-found: ignore

  image-compliance:
    name: 2 image · CIS benchmark (dockle)
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: image-compliance
      OUT: reports/image-compliance
      VERDICT_FILE: reports/image-compliance/verdict.json
      NATIVE: reports/image-compliance/dockle.txt
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - run: |
          set -uo pipefail
          mkdir -p "$OUT"
          got=$(tar -xOf "$RUNNER_TEMP/image/image.oci.tar" index.json | jq -r '.manifests[0].digest')
          [ "$got" = "$DIGEST" ] || { echo "::error::image artifact is $got, the build said $DIGEST"; exit 0; }
          # docker load only reads OCI layouts with the containerd image store
          skopeo copy --quiet "oci-archive:$RUNNER_TEMP/image/image.oci.tar" "docker-daemon:$IMAGE_TAG"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/$OUT:/out" "$DOCKLE" \
            -f json -o /out/dockle.json --exit-code 0 "$IMAGE_TAG" || true
      - id: verdict
        if: always()
        env:
          TOOL: dockle 0.4.15
        run: python3 .github/scripts/verdict.py dockle "$OUT/dockle.json"
      # dockle's own text report (a second, local run), accepted checks left out.
      - name: tool report
        if: always()
        run: |
          touch "$OUT/accepted-ids.txt"
          mapfile -t ignore < <(sed 's/^/-i=/' "$OUT/accepted-ids.txt")
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/$OUT:/out" "$DOCKLE" \
            --no-color --exit-code 0 "${ignore[@]}" -o /out/dockle.txt "$IMAGE_TAG" || true
          python3 .github/scripts/findings.py native "$NATIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-image-compliance
          path: reports/image-compliance/
          if-no-files-found: ignore

  django-deploy-check:
    name: 2 image · django check --deploy
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      CONTROL: django-deploy-check
      OUT: reports/django-deploy-check
      VERDICT_FILE: reports/django-deploy-check/verdict.json
      NATIVE: reports/django-deploy-check/check-deploy.txt
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - id: check
        # The production settings as shipped (no DEBUG), inside the image.
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          got=$(tar -xOf "$RUNNER_TEMP/image/image.oci.tar" index.json | jq -r '.manifests[0].digest')
          [ "$got" = "$DIGEST" ] || { echo "::error::image artifact is $got, the build said $DIGEST"; exit 0; }
          # docker load only reads OCI layouts with the containerd image store
          skopeo copy --quiet "oci-archive:$RUNNER_TEMP/image/image.oci.tar" "docker-daemon:$IMAGE_TAG"
          DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))'); export DJANGO_SECRET_KEY
          docker run --rm --read-only --tmpfs /tmp -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS=app.example.invalid \
            "$IMAGE_TAG" python manage.py check --deploy --fail-level WARNING > "$OUT/check-deploy.txt" 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.check.outputs.rc }}
          TOOL: django manage.py check --deploy
        run: python3 .github/scripts/verdict.py django-check "$OUT/check-deploy.txt"
      # The tool's own report under the verdict (findings.py native).
      - name: tool report
        if: always()
        run: python3 .github/scripts/findings.py native "$NATIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-django-deploy-check
          path: reports/django-deploy-check/
          if-no-files-found: ignore

  # ── 3 package ──────────────────────────────────────────────────────────
  publish:
    name: 3 package · push + sign + attest
    needs: [build, unit-tests, code-quality, sast-semgrep, secrets-gitleaks, secrets-trufflehog,
            sca-trivy, iac-checkov, image-scan, sbom, image-compliance, django-deploy-check]
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      published: ${{ steps.verify.outputs.failed == '' && steps.verify.outcome == 'success' }}
    env:
      CONTROL: publish
      OUT: reports/publish
      VERDICT_FILE: reports/publish/verdict.json
      DIGEST: ${{ needs.build.outputs.digest }}
      REF: ghcr.io/usfali-ke/django-gates-demo@${{ needs.build.outputs.digest }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      # The keyless signature's identity is this file on main — what
      # Kyverno admits and devsecops-release.yml verifies.
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yml@refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: ready
        name: Every stage 1–2 control passed?
        # A signature is the statement "this passed every static control".
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$OUT"
          not_ready=$(jq -r 'to_entries | map(select(.value.result != "success") | .key) | join(", ")' <<<"$NEEDS")
          echo "not_ready=$not_ready" >> "$GITHUB_OUTPUT"
          echo "go=$([ -z "$not_ready" ] && [ "$PUBLISH" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-sbom
          path: ${{ runner.temp }}/sbom
      - if: steps.ready.outputs.go == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # cosign v2 writes the .sig/.att tags Kyverno verifies.
          cosign-release: v2.6.5
      - if: steps.ready.outputs.go == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.ready.outputs.go == 'true'
        name: Push the tested bytes (digest preserved)
        run: |
          set -euo pipefail
          skopeo copy --preserve-digests "oci-archive:${RUNNER_TEMP}/image/image.oci.tar" "docker://${IMAGE}:sha-${GITHUB_SHA}"
          pushed=$(skopeo inspect --raw "docker://${IMAGE}:sha-${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)
          [ "sha256:$pushed" = "$DIGEST" ] || { echo "::error::registry has sha256:$pushed, built $DIGEST"; exit 1; }
      - if: steps.ready.outputs.go == 'true'
        name: Sign, attest SBOM + SLSA v1 provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          set -euo pipefail
          python3 .github/scripts/slsa_predicate.py > "$OUT/provenance.slsa1.json"
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom/sbom.cdx.json" "$REF"
          cosign attest --yes --type slsaprovenance1 --predicate "$OUT/provenance.slsa1.json" "$REF"
      - if: steps.ready.outputs.go == 'true'
        # GitHub's attestation store too (`gh attestation verify`). Not
        # pushed to the registry: GHCR has no referrers API, so pushing
        # rewrites the sha256-<digest> fallback tag and drops cosign's SBOM.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
      - id: verify
        if: always() && steps.ready.outputs.go == 'true'
        # Pass means the signature and both attestations verify against the
        # identity admission checks — not merely that signing ran.
        run: |
          fail=""
          id=(--certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER")
          cosign verify "${id[@]}" "$REF" > "$OUT/cosign-verify.json" || fail="$fail signature"
          cosign verify-attestation "${id[@]}" --type cyclonedx "$REF" > /dev/null || fail="$fail sbom-attestation"
          cosign verify-attestation "${id[@]}" --type slsaprovenance1 "$REF" > /dev/null || fail="$fail slsa-attestation"
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          NOT_READY: ${{ steps.ready.outputs.not_ready }}
          GO: ${{ steps.ready.outputs.go }}
          VERIFY_FAILED: ${{ steps.verify.outputs.failed }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TOOL: skopeo + cosign 2.6.5 (keyless, Rekor) + actions/attest-build-provenance
        run: |
          if [ -n "$NOT_READY" ]; then
            python3 .github/scripts/verdict.py signed   # fail: lists the controls that didn't pass
          elif [ "$GO" != true ]; then
            python3 .github/scripts/verdict.py result skipped \
              "not published: images are pushed and signed only from main — a push or a manual run (this run: ${GITHUB_EVENT_NAME} on ${GITHUB_REF}); every stage 1–2 control passed"
          elif [ "$VERIFY_OUTCOME" = success ]; then
            python3 .github/scripts/verdict.py signed
          else
            VERIFY_FAILED="${VERIFY_FAILED:- push/sign step failed}" python3 .github/scripts/verdict.py signed
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-publish
          path: reports/publish/
          if-no-files-found: ignore

  gate-g1:
    name: G1 merge gate
    needs: [reviewers, unit-tests, sast-semgrep, secrets-gitleaks, secrets-trufflehog, commits-signed]
    if: always() && startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/gate
        with:
          gate: G1
          needs: ${{ toJSON(needs) }}
          subject: pr-${{ github.event.pull_request.number }}
          commit-sha: ${{ github.event.pull_request.head.sha }}

  # The Control Gate between CI and the release pipeline (gate.py GATES
  # "G2"): nothing is deployed unless it passed for this digest, which
  # devsecops-release.yml checks in the signed evidence.
  gate-g2:
    name: G2 Control Gate
    needs: [build, unit-tests, code-quality, sast-semgrep, secrets-gitleaks, secrets-trufflehog, sca-trivy, iac-checkov,
            image-scan, sbom, image-compliance, django-deploy-check, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: gate
        uses: ./.github/actions/gate
        with:
          gate: G2
          needs: ${{ toJSON(needs) }}
          subject: ${{ needs.build.outputs.digest || github.sha }}
          artifact-digest: ${{ needs.build.outputs.digest }}
          record: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          allow-skipped: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && 'artifact_signed_attested' || '' }}

  # ── 4 evidence ─────────────────────────────────────────────────────────
  evidence:
    name: 4 evidence bundle
    needs: [build, unit-tests, code-quality, sast-semgrep, secrets-gitleaks, secrets-trufflehog, sca-trivy, iac-checkov,
            reviewers, commits-signed, image-scan, sbom, image-compliance, django-deploy-check, publish,
            gate-g1, gate-g2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      REF: ghcr.io/usfali-ke/django-gates-demo@${{ needs.build.outputs.digest }}
      PREDICATE_TYPE: https://github.com/${{ github.repository }}/evidence/v1
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yml@refs/heads/main
      # Controls that apply to this event; the rest aren't listed as missing.
      CONTROLS: >-
        build,unit-tests,coverage,code-quality,sast-semgrep,secrets-gitleaks,secrets-trufflehog,
        sca-trivy,iac-checkov,${{ startsWith(github.event_name, 'pull_request') && 'reviewers,commits-signed,' || '' }}image-scan,sbom,
        image-compliance,django-deploy-check,publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-*
          path: ${{ runner.temp }}/in
      - name: Bundle + hash manifest
        run: |
          set -euo pipefail
          CONTROLS=$(tr -d ' \n' <<<"$CONTROLS") python3 .github/scripts/evidence.py "$RUNNER_TEMP/in" evidence
          (cd evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: error
      # On main, bind the evidence to the published image: anyone holding
      # the digest can fetch and verify the manifest, then check each report
      # file against its sha256. devsecops-release.yml requires it.
      - if: needs.publish.outputs.published == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - if: needs.publish.outputs.published == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: needs.publish.outputs.published == 'true'
        name: Attest the evidence manifest to the image digest
        run: |
          set -euo pipefail
          cosign attest --yes --type "$PREDICATE_TYPE" --predicate evidence/manifest.json "$REF"
          cosign verify-attestation --type "$PREDICATE_TYPE" --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" "$REF" > /dev/null
          echo "Evidence manifest attested to ${REF} (${PREDICATE_TYPE})" >> "$GITHUB_STEP_SUMMARY"

  # ── 5 release ──────────────────────────────────────────────────────────
  # A published, Control-Gate-passed, evidence-attested digest starts the
  # release pipeline for this commit: deploy to dev and test it there, then
  # staging and prod, each behind its approval gate.
  release:
    name: 5 start the release pipeline
    needs: [publish, gate-g2, evidence]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
      && needs.gate-g2.outputs.status == 'pass' && needs.evidence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run devsecops-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f start=dev -f kind=planned -f commit="$GITHUB_SHA"
          echo "Started devsecops-release for ${GITHUB_SHA:0:7} (dev → staging → prod): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/devsecops-release.yml" >> "$GITHUB_STEP_SUMMARY"

  # ── PR comment ─────────────────────────────────────────────────────────
  # One comment per PR, edited in place: every control, what's new compared
  # with main, links to the job summaries. Its own job so only it can write
  # to the PR. Same-repo PRs only: a fork's token is read-only, and running
  # fork code with a write token is what pull_request_target gets wrong.
  pr-comment:
    name: PR findings comment
    needs: evidence
    if: always() && startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: ${{ runner.temp }}/current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-*
          path: ${{ runner.temp }}/current
      - name: Baseline (latest completed run on main)
        continue-on-error: true
        run: |
          set -uo pipefail
          read -r id sha < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/devsecops-pipeline.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0] | "\(.id) \(.head_sha)"')
          [ -n "${id:-}" ] && [ "$id" != null ] || exit 0
          gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'report-*' -D "$RUNNER_TEMP/baseline" && echo "BASELINE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Post or update the comment
        run: |
          set -euo pipefail
          python3 .github/scripts/findings.py pr-comment "$RUNNER_TEMP/current" "$RUNNER_TEMP/baseline" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- devsecops-findings -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          fi
