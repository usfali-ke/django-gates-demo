# AI security review of every pull request by the Hermes agent.
#
# The Hermes gateway (webhook platform, route `github-pr-review`) runs on the
# lab network at http://192.168.122.191:8644 — GitHub's servers can't reach
# it, so a repository webhook would never arrive. Instead this job runs on
# the in-cluster self-hosted runner (`lab-runner`, Actions Runner Controller
# on the kind cluster), which can, and forwards the PR event exactly as a
# GitHub webhook would: same JSON payload, `X-GitHub-Event: pull_request`,
# `X-Hub-Signature-256` HMAC over the body. Hermes then fetches the diff
# (`gh pr diff`) and posts its review as a PR comment.
#
# Setup (per repo):
#   - secret   HERMES_WEBHOOK_SECRET   = the route's `secret` in ~/.hermes/config.yaml
#   - variable HERMES_WEBHOOK_URL      (optional) overrides the default below
# Source of truth: security-dashboard/pipeline/github/hermes-pr-review/.
#
# Why pull_request_target: it runs THIS file as it is on the base branch, so
# a PR can't rewrite the job that runs on the self-hosted runner or read the
# signing secret. That is only safe because nothing here checks out or
# executes PR code — the job sends metadata; Hermes reads the diff itself.
# Fork PRs never run on the self-hosted runner.
name: hermes-pr-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}  # the job calls no GitHub API; Hermes comments with its own gh login

concurrency:
  # A new push supersedes a review that hasn't been sent yet.
  group: hermes-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  forward:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: lab-runner
    timeout-minutes: 5
    steps:
      - name: Send the PR event to Hermes
        env:
          HERMES_URL: ${{ vars.HERMES_WEBHOOK_URL || 'http://192.168.122.191:8644/webhooks/github-pr-review' }}
          HERMES_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          # Unique per run attempt: Hermes deduplicates on X-GitHub-Delivery
          # for an hour, and a deliberate re-run should review again.
          DELIVERY_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${HERMES_SECRET}" ]; then
            echo "::error::HERMES_WEBHOOK_SECRET is not set for this repository"
            exit 1
          fi
          # The event payload as GitHub delivered it to this run — the same
          # shape a pull_request webhook carries, so the route's {number},
          # {pull_request.title}, {repository.full_name}... templates resolve.
          # Compact form, signed byte-for-byte as sent.
          jq -c . "$GITHUB_EVENT_PATH" > body.json
          sig="sha256=$(openssl dgst -sha256 -hmac "$HERMES_SECRET" -hex < body.json | awk '{print $NF}')"
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 \
            -X POST "$HERMES_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-GitHub-Delivery: $DELIVERY_ID" \
            -H "X-Hub-Signature-256: $sig" \
            --data-binary @body.json)
          echo "Hermes answered HTTP $code: $(cat response.json)"
          case "$code" in
            2??) echo "### Hermes review requested for PR #$(jq -r .number body.json) — the review is posted as a PR comment" >> "$GITHUB_STEP_SUMMARY" ;;
            401) echo "::error::Hermes rejected the signature — HERMES_WEBHOOK_SECRET doesn't match the route secret"; exit 1 ;;
            404) echo "::error::Hermes has no such route — check HERMES_WEBHOOK_URL against the routes: key"; exit 1 ;;
            429) echo "::warning::Hermes rate limit hit; re-run this job in a minute"; exit 1 ;;
            *)   echo "::error::Hermes webhook failed (HTTP $code)"; exit 1 ;;
          esac
